services:
  app:
    build: .
    image: ubilaundry-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATA_DIR=/data
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    volumes:
      - ubilaundry-data:/data

volumes:
  ubilaundry-data:
